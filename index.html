ity is simulated. Nothing here establishes real-world verification or universal agent safety, and all actions stay inside the simulation.</p><h2>What it covers</h2><ul><li>Context construction, tool use, authorization and evidence evaluation.</li><li>Nine scenarios: revenue report, prompt injection, bad evidence, temporary tool failure, persistent timeout, wrong calculation, missing evidence, context overflow and budget exhausted.</li><li>Rewind, comparison and step-by-step inspection of the same run.</li><li>Agent Runtime 101, plus the assumptions and evidence behind every step.</li></ul></main></noscript><script type="module" src="/src/main.tsx"></script></body></html>
